<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        *{
            box-sizing: border-box;
            align-items: center;
        }
        
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 20px;
            background-color: #c9bcda;
            padding: 20px;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .container {
        width: 400px;
        margin: 80px auto;
        padding: 25px;
        background-color: #ffebeb;
        border: 2px solid #1a0e0e;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        border-radius: 10px;
    }
        label {
            font-size: 20px;
        }

        span {
            font-size: 15px;
            color: red;
        }

        input {
            padding: 6px;
            width: 350px;
            font-size: large;
        }

        input:invalid {
            border: 2px solid red;
        }

        input:valid {
            border: 2px solid rgb(0, 0, 0);
        }

        button {
            background-color: black;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 10px;
            align-items: center;
            display: block;
            margin-left: auto;
        }
    </style>
</head>

<body>
    <div class="container">

<h1>Student Registration Form</h1>

<form>

    <label>Full Name:</label><br>
    <input type="text"
           name="studentName"
           placeholder="Enter your full name"
           pattern="[A-Za-z ]{5,50}"
           title="Must contain 5–50 letters only"
           required><br>
    <span>Must contain 5–50 letters</span>
    <br><br>

 
    <label>Email:</label><br>
    <input type="email"
           name="studentEmail"
           placeholder="Enter your email"
           title="Enter a valid email address"
           required><br>
    <span>Valid email required</span>
    <br><br>

    
    <label>Age:</label><br>
    <input type="number"
           name="studentAge"
           placeholder="Enter your age"
           min="16"
           max="30"
           title="Age must be between 16 and 30"
           required><br>
    <span>Age 16–30 only</span>
    <br><br>

    <button type="submit">Submit</button>
</form>
</div>

<script>
    const form = document.querySelector('form');

    form.addEventListener('submit', function(event) {
        event.preventDefault();  //stops page to reload
        if (form.checkValidity()) {
            alert("Form submitted successfully!");
        }
    });
</script>

</body>
</html>
